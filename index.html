<title>Здоровое тело</title>
<style>
:root{
  --bg:#ffffff; --card:#ffffff; --card2:#f4f5f7; --text:#15171c; --muted:#6b7280; --line:#eceef2;
  --accent:#e5383b; --accent2:#ff7a59; --accent-soft:#fff0ee; --accent-text:#ffffff; --ok:#16a35a; --ok-soft:#e6f6ed;
  --warn:#e07a12; --warn-soft:#fff3e4; --fast:#d63c3c; --fast-soft:#fdeeee; --calm:#3b6fe0; --calm-soft:#ebf1fe;
  --water:#1d9bf0; --water-soft:#e7f5fe; --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0f11; --card:#17191d; --card2:#202329; --text:#eceef2; --muted:#9aa1ac; --line:#262a31;
  --accent:#ff5a5f; --accent2:#ff8a65; --accent-soft:#3a1c1e; --accent-text:#ffffff; --ok:#3ccf7e; --ok-soft:#163324;
  --warn:#f0a050; --warn-soft:#3a2a17; --fast:#ff7b7b; --fast-soft:#3d2020; --calm:#7ea6f5; --calm-soft:#1c2a42;
  --water:#5cb8f5; --water-soft:#14303f; --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e0f11; --card:#17191d; --card2:#202329; --text:#eceef2; --muted:#9aa1ac; --line:#262a31;
  --accent:#ff5a5f; --accent2:#ff8a65; --accent-soft:#3a1c1e; --accent-text:#ffffff; --ok:#3ccf7e; --ok-soft:#163324;
  --warn:#f0a050; --warn-soft:#3a2a17; --fast:#ff7b7b; --fast-soft:#3d2020; --calm:#7ea6f5; --calm-soft:#1c2a42;
  --water:#5cb8f5; --water-soft:#14303f; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);max-width:100%}
html{-webkit-text-size-adjust:100%;overscroll-behavior-x:none}
body{overflow-x:hidden;overflow-x:clip}
input,select,textarea{font-size:16px}
.top,.tabs,.timerbar{touch-action:none}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
.wrap{max-width:680px;margin:0 auto;padding:0 16px;overflow-wrap:anywhere}
main,.card{min-width:0;max-width:100%}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.brand b{font-size:17px;letter-spacing:-.01em}
.gear{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--card2);color:var(--muted)}
.gear svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gear.on{background:var(--accent-soft);color:var(--accent)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.busy i{background:var(--warn)} .sync.off i{background:var(--fast)}
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.weekbar .wk{font-size:13px;color:var(--muted)} .weekbar .wk b{color:var(--text)}
.nav{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.nav:disabled{opacity:.35;cursor:default}
.nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.todaybtn{font-size:12px;padding:5px 10px;white-space:nowrap;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding-bottom:10px}
.chip{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;border-radius:12px;border:1px solid transparent;min-width:0}
.chip small{font-size:11px;color:var(--muted)} .chip span{font-size:16px;font-weight:600}
.chip em{width:5px;height:5px;border-radius:50%;background:transparent;margin-top:2px}
.chip.has em{background:var(--muted)} .chip.done em{background:var(--ok)}
.chip.today{border-color:var(--accent);background:var(--card)}
.chip .tl{font-size:9px;font-weight:700;letter-spacing:0;white-space:nowrap;overflow-wrap:normal;color:var(--accent);margin-top:1px;line-height:1.2}
.chip.sel .tl{color:inherit}
.chip.sel{background:linear-gradient(160deg,var(--accent2),var(--accent));color:var(--accent-text);border-color:transparent;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)} .chip.sel small{color:inherit;opacity:.8} .chip.sel em{background:currentColor}
main{padding:14px 0 110px}
.banner{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--text);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.hero{background:linear-gradient(140deg,var(--accent-soft),var(--card) 65%);border-color:color-mix(in srgb,var(--accent) 14%,var(--line))}
.hero h1{font-size:22px;margin:4px 0 6px;letter-spacing:-.01em}
.muted{color:var(--muted)} .small{font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.grid4{grid-template-columns:1fr 1fr}}
.metric label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:20px;font-weight:600;outline:none;min-width:0}
.field:focus{border-color:var(--calm);background:var(--card)}
.field.sm{font-size:16px;font-weight:500;padding:8px 10px}
.field.bad{border-color:var(--fast)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px;transition:width .3s}
.bar.water i{background:var(--water)} .bar.warn i{background:var(--warn)}
.link{display:block;width:100%;text-align:left}
.rowh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rowh h2{font-size:17px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--muted);white-space:nowrap;max-width:100%}
.pills .pill{white-space:normal;line-height:1.35}
.pill.g{background:var(--ok-soft);color:var(--ok)} .pill.w{background:var(--water-soft);color:var(--water)}
.pill.o{background:var(--warn-soft);color:var(--warn)} .pill.r{background:var(--fast-soft);color:var(--fast)} .pill.b{background:var(--calm-soft);color:var(--calm)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.go{font-size:13px;color:var(--accent);font-weight:600;margin-top:10px;display:inline-block}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:4px}
.ck{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;background:var(--card2);transition:.15s}
.ck svg{width:18px;height:18px;stroke:var(--accent-text);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.ck.on{background:var(--ok);border-color:var(--ok)} .ck.on svg{opacity:1}
.ck.wt.on{background:var(--water);border-color:var(--water)}
.item .t{font-weight:600} .item .d{font-size:14px;color:var(--muted);margin-top:2px}
.item.on .t{color:var(--muted)}
.task{font-size:15px;margin-top:3px;color:var(--text)}
.time{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.tbtn{padding:0 0 1px;background:none;border:0;border-bottom:1px dashed currentColor;border-radius:0;font:inherit;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.ing{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.ing td,.ing th{padding:6px 0;border-top:1px solid var(--line);vertical-align:top}
.ing th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;border-top:0}
.ing td.n,.ing th.n{text-align:right;white-space:nowrap;padding-left:10px;font-variant-numeric:tabular-nums}
details{margin-top:6px} summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
.isteps{margin:8px 0 2px;padding-left:20px;font-size:14px;line-height:1.45} .isteps li{margin:4px 0}
summary::after{content:" ▾"} details[open] summary::after{content:" ▴"}
.tip{font-size:14px;color:var(--muted);margin-top:6px}
.restbtn{margin-top:8px;font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--calm-soft);color:var(--calm)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.kv b{white-space:nowrap}
.stat{background:var(--card2);border-radius:12px;padding:10px}
.stat small{display:block;font-size:12px;color:var(--muted)} .stat b{font-size:19px;letter-spacing:-.01em}
.steprow{display:grid;grid-template-columns:1fr 120px 30px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.steprow:first-of-type{border-top:0}
.steprow .ok{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--card2)}
.steprow .ok.on{background:var(--ok)}
.steprow .ok svg{width:15px;height:15px;stroke:var(--accent-text);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.steprow .ok:not(.on) svg{opacity:0}
.steprow.cur .dn{color:var(--accent);font-weight:700}

.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;align-items:end;height:120px;margin-top:10px;position:relative}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
.bars i{display:block;background:var(--ok);border-radius:5px 5px 2px 2px;min-height:2px}
.bars i.miss{background:var(--warn)}
.bars .bv{position:relative;z-index:1;align-self:center;padding:0 3px;border-radius:4px;background:var(--card);font-size:10px;font-weight:700;color:var(--muted);text-align:center;margin-bottom:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bars u{position:absolute;left:-2px;right:-2px;border-top:2px dashed var(--muted);text-decoration:none}
.bars + .lbl{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
svg.chart{width:100%;height:auto;display:block}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:6px 4px}
.tbl td{text-align:right;padding:7px 4px;border-top:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr.cur td{font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:14px;background:linear-gradient(160deg,var(--accent2),var(--accent));color:var(--accent-text);font-weight:600}
.btn.sec{background:var(--card2);color:var(--text)}
.timer{border-radius:14px;padding:14px;margin-top:10px;background:var(--card2);text-align:center}
.timer .btn{padding:9px 12px;font-size:14px;white-space:normal} .timer .btn.sec{background:var(--card)}
.timer.fast{background:var(--fast-soft)} .timer.calm{background:var(--calm-soft)}
.timer .ph{font-weight:700;font-size:15px}
.timer.fast .ph{color:var(--fast)} .timer.calm .ph{color:var(--calm)}
.timer .big{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1;margin:4px 0}
.timer .row{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.timerbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:6;display:flex;justify-content:center;pointer-events:none}
.timerbar>div{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--text);color:var(--bg);padding:9px 10px 9px 16px;border-radius:999px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.timerbar b{font-variant-numeric:tabular-nums;font-size:18px}
.timerbar button{background:var(--bg);color:var(--text);padding:5px 12px;border-radius:999px;font-size:13px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0 4px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;font-size:11px;color:var(--muted);font-weight:600}
.tabs svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent)}
.hbtn.pend{background:var(--accent);color:#fff;border-color:var(--accent)}
.tabs button{white-space:nowrap;overflow-wrap:normal;min-width:0} .brand b{white-space:nowrap}
@media (max-width:370px){.chip .tl{font-size:8px;letter-spacing:-.02em} .tabs button{font-size:10px;letter-spacing:-.02em} .brand b{font-size:16px} .sync>span{display:none}}
.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:14px}
.sec-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 2px 8px}
.wkrow{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px;width:100%;text-align:left}
.wkrow:first-child{border-top:0}
.wkrow.sel b{color:var(--accent)}
h2.stp{font-size:16px;margin-bottom:10px}
.lvls{display:flex;flex-direction:column;gap:8px}
.lvhead{font-weight:700;font-size:14px;margin:14px 0 8px}
.lvl{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2)}
.lvl span{font-size:13px;color:var(--muted)} .lvl.on{border-color:var(--accent);background:var(--accent-soft)} .lvl.on b{color:var(--accent)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--ok)}
.warncard{border-color:var(--fast);background:var(--fast-soft)} .warncard h2{color:var(--fast)}
.addrow{margin-top:10px} select.field{appearance:auto;font-size:16px}
.hlink{font-size:12px;font-weight:600;color:var(--muted);text-decoration:underline;padding:5px 2px;margin-top:8px}
.terms p{margin:0 0 10px;font-size:14px;line-height:1.5}
.hsteps{margin:10px 0 4px;display:flex;flex-direction:column;gap:10px}
.hs{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.hn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:14px}
.ht{font-weight:600;font-size:15px} .hd{font-size:14px;color:var(--muted);margin-top:2px}
.hbtn{margin-top:8px;font-size:12px;font-weight:600;padding:5px 9px;border-radius:999px;background:var(--fast-soft);color:var(--fast)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:9;background:var(--text);color:var(--bg);padding:12px 14px;border-radius:14px;font-size:14px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;max-width:560px;margin:0 auto}
.toast.on{opacity:1;transform:none}
.fpanel{margin-top:12px;padding:12px;border-radius:14px;background:var(--card2)}
.fpanel .field{background:var(--card)}
.calc{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--card);font-size:14px;color:var(--muted)} .calc b{color:var(--accent)}
.srow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .sn{flex:1;min-width:0;font-size:14px} .srow .sn small{display:block;color:var(--muted);font-size:12px}
.srow .sk{display:block;font-size:13px;color:var(--accent)}
.srow{flex-wrap:wrap}
.srow .sn{flex:1 1 100%}
.srow .sg{flex:1;min-width:0;padding:8px 10px;font-size:16px}
.srow .sadd{flex:none;width:38px;height:36px;padding:0;font-size:20px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,12,16,.45);display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:var(--card);width:100%;max-width:680px;max-height:85vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.xbtn{width:28px;height:28px;border-radius:8px;background:var(--card2);color:var(--muted);font-size:18px;line-height:1}
</style>

  <div id="strip"></div>

ение прекратить и заменить."],["Хват","Если на турнике первым сдаётся хват, это нормально для первых недель. Висы из тренировки Б это исправят."],["Сон","7–8 часов. При недосыпе аппетит растёт, а мышцы восстанавливаются хуже."],["Еда до и после","Ужин в 16:30 даёт энергию на тренировку в 20:00. Творог после занятия закрывает потребность в белке."],["Здоровье","При проблемах с давлением, сердцем или суставами начните после консультации с врачом."]],"scale":[["3–4 · легко","Можно свободно разговаривать. Ходьба, разминка, заминка."],["5–6 · умеренно","Дыхание учащённое, говорить можно короткими предложениями. Спокойные отрезки интервалов."],["7–8 · тяжело","В силовой: в конце подхода остаётся запас в 2 повтора. В интервалах: говорить удаётся только отдельными словами. Основная рабочая зона."],["9–10 · предел","Работа до отказа. В этой программе не нужна: риск травмы выше, а пользы для похудения нет."]]};</script>
<script>

/* График шагов: по дням выбранной недели, по неделям программы или по месяцам. */
const MSHORT = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
function stepsChart(){
  let mode = "weeks"; try { mode = localStorage.getItem("pp_chart") || "weeks"; } catch (e) {}
  const P = program(), goalOf = i => P.steps[weekOf(i) - 1] * 1000, t = todayIdx();
  const avgOf = idx => { let s = 0, n = 0, g = 0; idx.forEach(i => { g += goalOf(i); const v = day(i).steps; if (v != null) { s += v; n++; } }); return { avg: n ? s / n : null, goal: idx.length ? g / idx.length : 0, n }; };
  let cols = [], title = "";
  if (mode === "days") { const w = weekOf(S.sel), f = (w - 1) * 7;
    cols = WDS.map((l, j) => Object.assign(avgOf([f + j]), { l, cur: f + j === t })); title = "Неделя " + w + " по дням"; }
  else if (mode === "months") { const by = {};
    for (let i = 0; i < DAYS; i++) { const d = dateAt(i), k = d.getFullYear() * 12 + d.getMonth(); (by[k] = by[k] || []).push(i); }
    cols = Object.keys(by).sort((a, b) => a - b).map(k => Object.assign(avgOf(by[k]), { l: MSHORT[k % 12], cur: by[k].includes(t) })); title = "Среднее за месяц"; }
  else { cols = P.steps.map((_, k) => Object.assign(avgOf(Array.from({ length: 7 }, (_, j) => k * 7 + j)), { l: String(k + 1), cur: weekOf(clampI(t)) === k + 1 })); title = "Среднее за неделю"; }
  const maxV = Math.max(10000, ...cols.map(c => Math.max(c.avg || 0, c.goal))) * 1.18;
  const short = v => v >= 10000 ? num(Math.round(v / 1000), 0) + "к" : num(Math.round(v / 100) / 10, 1) + "к";
  const n = cols.length, gt = `grid-template-columns:repeat(${n},1fr)`;
  const bars = cols.map(c => `<div><u style="bottom:${c.goal / maxV * 100}%"></u>${c.avg != null ? `<b class="bv">${short(c.avg)}</b><i class="${c.avg < c.goal ? "miss" : ""}" style="height:${c.avg / maxV * 100}%"></i>` : ""}</div>`).join("");
  const withData = cols.filter(c => c.avg != null), all = withData.length ? withData.reduce((s, c) => s + c.avg, 0) / withData.length : null;
  return `<section class="card">
    <div class="seg">${[["days","Дни"],["weeks","Недели"],["months","Месяцы"]].map(([k, l]) => `<button class="${mode === k ? "on" : ""}" data-chart="${k}">${l}</button>`).join("")}</div>
    <div class="rowh" style="margin-top:10px"><span class="hint" style="margin:0">${esc(title)}</span>${all != null ? `<span class="hint" style="margin:0">в среднем <b>${int(all)}</b> · ${kmTxt(all)}</span>` : ""}</div>
    <div class="bars" style="${gt}">${bars}</div><div class="lbl" style="${gt}">${cols.map(c => `<span style="${c.cur ? "color:var(--accent);font-weight:700" : ""}">${c.l}</span>`).join("")}</div>
    <div class="hint">${mode === "days" ? "Другую неделю выберите стрелками вверху экрана. " : ""}Пунктир — цель. Зелёный — цель выполнена, оранжевый — ниже цели. Над столбиком — шаги в тысячах.</div></section>`;
}

function weightSeries(){ const r = []; for (let i = 0; i < DAYS; i++) { const v = day(i).weight; if (v != null) r.push([i, v]); } return r; }

  for (let v = lo; v <= hi; v += step) grid += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;
  for (let k = 0; k <= 12; k += 3) grid += `<text x="${x(Math.min(k*7, DAYS-1))}" y="${H-8}" text-anchor="${k === 0 ? "start" : k === 12 ? "end" : "middle"}" font-size="11" fill="var(--muted)">${k === 0 ? "старт" : "нед " + k}</text>`;

  const line = pts.length > 1 ? `<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p => x(p[0])+","+y(p[1])).join(" ")}"/>` : "";

  const chart = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График веса"><defs><clipPath id="pc"><rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}"/></clipPath></defs>${grid}${startLine}<g clip-path="url(#pc)">${goalLine}</g>${line}${dots}</svg>`;

  if (ds.check) { const k = ds.check; mutDay(S.sel, d => { d.train = d.train || {}; if (d.train[k]) delete d.train[k]; else d.train[k] = true; }); render(); return; }
  if (ds.meal) { const k = ds.meal; mutDay(S.sel, d => { d.meals = d.meals || {}; if (d.meals[k]) delete d.meals[k]; else d.meals[k] = true; }); render(); return; }
  if (ds.alt != null) { const v = ds.alt === "1"; if (!!day(S.sel).altBreakfast === v) return; mutDay(S.sel, d => { if (v) d.altBreakfast = true; else delete d.altBreakfast; }); render(); return; }
  if (ds.rest) { startRest(+ds.rest); return; }
  if (ds.reststop != null) { REST = null; drawRest(); return; }
  if (ds.it) { itAction(ds.it); return; }
  if (extraClick(ds, b)) return;
});
function applyField(el, delay){
  const f = el.dataset.f; if (!f) return false;
  if (f === "fact") { const i = +el.dataset.i, k = el.dataset.k, v = el.value.slice(0, 300);
    if (((day(i).fact || {})[k] || "") === v) return false;
    mutDay(i, d => { d.fact = d.fact || {}; if (v) d.fact[k] = v; else delete d.fact[k]; }, delay); return true; }
  const v = parseNum(el.value);
  const lim = { weight: [30, 300], steps: [0, 100000], startWeight: [30, 300], height: [100, 250] }[f];
  if (Number.isNaN(v) || (v != null && (v < lim[0] || v > lim[1]))) { el.classList.add("bad"); return false; }
  el.classList.remove("bad");
  const val = v == null ? null : (f === "steps" || f === "height") ? Math.round(v) : Math.round(v*10)/10;
  if (f === "startWeight" || f === "height") {
    if (val == null || S.profile[f] === val) return false;
    S.profile = Object.assign({}, S.profile, { [f]: val }); queueSave("profile", delay); return true; }
  const i = +el.dataset.i, cur = day(i)[f]; if ((cur == null ? null : cur) === val) return false;
  mutDay(i, d => { if (val == null) delete d[f]; else d[f] = val; }, delay); return true;
}
document.addEventListener("input", e => { if (e.target.matches("input[data-f]")) applyField(e.target, 900); });
document.addEventListener("change", e => { if (e.target.matches("input[data-f]")) { applyField(e.target, 200); safeRender(); } });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("input[data-f]")) e.target.blur(); });

/* ---------- theme ---------- */
function getTheme(){ let t = null; try { t = localStorage.getItem("pp_theme"); } catch (e) {}
  if (t === "light" || t === "dark") return t; return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
function applyTheme(t){
  const root = document.documentElement;
  root.setAttribute("data-theme", t);
  const dark = t === "dark";
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => { m.setAttribute("content", dark ? "#0e0f11" : "#ffffff"); m.removeAttribute("media"); });
}
applyTheme(getTheme());
if (window.matchMedia) { try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => applyTheme(getTheme())); } catch (e) {} }

/* ---------- day change while the app stays open ---------- */
let lastTodayKey = "";
function checkNewDay(){
  if (!S.profile.start) return;
  const k = ymd(new Date());
  if (!lastTodayKey) { lastTodayKey = k; return; }
  if (k !== lastTodayKey) { lastTodayKey = k; S.sel = clampI(todayIdx()); safeRender(); }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkNewDay(); });
window.addEventListener("focus", checkNewDay);
window.addEventListener("pageshow", checkNewDay);
setInterval(checkNewDay, 60000);
setInterval(() => { if (document.visibilityState === "visible" && S.sel === todayIdx() && (S.tab === "today" || S.tab === "steps") && !document.getElementById("modal")) safeRender(); }, 300000);
/* ---------- boot ---------- */
setTimeout(checkNewDay, 0);
window.__plan = { program, nutrition, mealPlan, plan, foodTotals, warnings, burned };
boot();
})();
