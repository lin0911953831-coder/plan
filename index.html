<title>Здоровое тело</title>
<style>
:root{
  --bg:#f4f5f2; --card:#ffffff; --card2:#f0f2ee; --text:#18201b; --muted:#66706a; --line:#e2e6e0;
  --accent:#23845d; --accent-soft:#e1f2e9; --accent-text:#ffffff;
  --warn:#c26a14; --warn-soft:#fbeedd; --fast:#d1462f; --fast-soft:#fbe3df; --calm:#2f6fd1; --calm-soft:#e1ebfb;
  --water:#2a86c9; --water-soft:#e0f0fb; --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 14px rgba(20,30,25,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111412; --card:#1a1e1b; --card2:#222723; --text:#e7ece8; --muted:#97a19a; --line:#2c322e;
  --accent:#4cc38f; --accent-soft:#183528; --accent-text:#0d1a13;
  --warn:#eba04f; --warn-soft:#3a2a17; --fast:#f07a64; --fast-soft:#3d221d; --calm:#79a7f2; --calm-soft:#1c2a40;
  --water:#62b4ec; --water-soft:#16303f; --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111412; --card:#1a1e1b; --card2:#222723; --text:#e7ece8; --muted:#97a19a; --line:#2c322e;
  --accent:#4cc38f; --accent-soft:#183528; --accent-text:#0d1a13;
  --warn:#eba04f; --warn-soft:#3a2a17; --fast:#f07a64; --fast-soft:#3d221d; --calm:#79a7f2; --calm-soft:#1c2a40;
  --water:#62b4ec; --water-soft:#16303f; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.brand b{font-size:17px;letter-spacing:-.01em}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--accent)} .sync.busy i{background:var(--warn)} .sync.off i{background:var(--fast)}
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.weekbar .wk{font-size:13px;color:var(--muted)} .weekbar .wk b{color:var(--text)}
.nav{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.nav:disabled{opacity:.35;cursor:default}
.nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.todaybtn{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding-bottom:10px}
.chip{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;border-radius:12px;border:1px solid transparent;min-width:0}
.chip small{font-size:11px;color:var(--muted)} .chip span{font-size:16px;font-weight:600}
.chip em{width:5px;height:5px;border-radius:50%;background:transparent;margin-top:2px}
.chip.has em{background:var(--muted)} .chip.done em{background:var(--accent)}
.chip.today{border-color:var(--line);background:var(--card)}
.chip.sel{background:var(--accent);color:var(--accent-text);border-color:var(--accent)} .chip.sel small{color:inherit;opacity:.8} .chip.sel em{background:currentColor}
main{padding:14px 0 110px}
.banner{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--text);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.hero h1{font-size:22px;margin:4px 0 6px;letter-spacing:-.01em}
.muted{color:var(--muted)} .small{font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.grid4{grid-template-columns:1fr 1fr}}
.metric label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:20px;font-weight:600;outline:none;min-width:0}
.field:focus{border-color:var(--accent);background:var(--card)}
.field.sm{font-size:15px;font-weight:500;padding:8px 10px}
.field.bad{border-color:var(--fast)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.water i{background:var(--water)} .bar.warn i{background:var(--warn)}
.link{display:block;width:100%;text-align:left}
.rowh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rowh h2{font-size:17px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--muted);white-space:nowrap}
.pill.g{background:var(--accent-soft);color:var(--accent)} .pill.w{background:var(--water-soft);color:var(--water)}
.pill.o{background:var(--warn-soft);color:var(--warn)} .pill.r{background:var(--fast-soft);color:var(--fast)} .pill.b{background:var(--calm-soft);color:var(--calm)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.go{font-size:13px;color:var(--accent);font-weight:600;margin-top:10px;display:inline-block}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:4px}
.ck{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;background:var(--card2);transition:.15s}
.ck svg{width:18px;height:18px;stroke:var(--accent-text);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.ck.on{background:var(--accent);border-color:var(--accent)} .ck.on svg{opacity:1}
.ck.wt.on{background:var(--water);border-color:var(--water)}
.item .t{font-weight:600} .item .d{font-size:14px;color:var(--muted);margin-top:2px}
.item.on .t{color:var(--muted)}
.task{font-size:15px;margin-top:3px;color:var(--text)}
.time{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.ing{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.ing td,.ing th{padding:6px 0;border-top:1px solid var(--line);vertical-align:top}
.ing th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;border-top:0}
.ing td.n,.ing th.n{text-align:right;white-space:nowrap;padding-left:10px;font-variant-numeric:tabular-nums}
details{margin-top:6px} summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" ▾"} details[open] summary::after{content:" ▴"}
.tip{font-size:14px;color:var(--muted);margin-top:6px}
.restbtn{margin-top:8px;font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--calm-soft);color:var(--calm)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.kv b{white-space:nowrap}
.stat{background:var(--card2);border-radius:12px;padding:10px}
.stat small{display:block;font-size:12px;color:var(--muted)} .stat b{font-size:19px;letter-spacing:-.01em}
.steprow{display:grid;grid-template-columns:1fr 120px 30px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.steprow:first-of-type{border-top:0}
.steprow .ok{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--card2)}
.steprow .ok.on{background:var(--accent)}
.steprow .ok svg{width:15px;height:15px;stroke:var(--accent-text);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.steprow .ok:not(.on) svg{opacity:0}
.steprow.cur .dn{color:var(--accent);font-weight:700}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;align-items:end;height:120px;margin-top:10px;position:relative}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
.bars i{display:block;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:2px}
.bars i.miss{background:var(--warn)}
.bars u{position:absolute;left:-2px;right:-2px;border-top:2px dashed var(--muted);text-decoration:none}
.bars + .lbl{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
svg.chart{width:100%;height:auto;display:block}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:6px 4px}
.tbl td{text-align:right;padding:7px 4px;border-top:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr.cur td{font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:12px;background:var(--accent);color:var(--accent-text);font-weight:600}
.btn.sec{background:var(--card2);color:var(--text)}
.timer{border-radius:14px;padding:14px;margin-top:10px;background:var(--card2);text-align:center}
.timer .btn{padding:9px 12px;font-size:14px} .timer .btn.sec{background:var(--card)}
.timer.fast{background:var(--fast-soft)} .timer.calm{background:var(--calm-soft)}
.timer .ph{font-weight:700;font-size:15px}
.timer.fast .ph{color:var(--fast)} .timer.calm .ph{color:var(--calm)}
.timer .big{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1;margin:4px 0}
.timer .row{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.timerbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:6;display:flex;justify-content:center;pointer-events:none}
.timerbar>div{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--text);color:var(--bg);padding:9px 10px 9px 16px;border-radius:999px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.timerbar b{font-variant-numeric:tabular-nums;font-size:18px}
.timerbar button{background:var(--bg);color:var(--text);padding:5px 12px;border-radius:999px;font-size:13px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0 4px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;font-size:11px;color:var(--muted);font-weight:600}
.tabs svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent)}
.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:14px}
.sec-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 2px 8px}
.wkrow{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px;width:100%;text-align:left}
.wkrow:first-child{border-top:0}
.wkrow.sel b{color:var(--accent)}
h2.stp{font-size:16px;margin-bottom:10px}
.lvls{display:flex;flex-direction:column;gap:8px}
.lvl{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2)}
.lvl span{font-size:13px;color:var(--muted)} .lvl.on{border-color:var(--accent);background:var(--accent-soft)} .lvl.on b{color:var(--accent)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--accent)}
.warncard{border-color:var(--fast);background:var(--fast-soft)} .warncard h2{color:var(--fast)}
.addrow{margin-top:10px} select.field{appearance:auto;font-size:15px}
.hbtn{margin-top:8px;font-size:12px;font-weight:600;padding:5px 9px;border-radius:999px;background:var(--fast-soft);color:var(--fast)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:9;background:var(--text);color:var(--bg);padding:12px 14px;border-radius:14px;font-size:14px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;max-width:560px;margin:0 auto}
.toast.on{opacity:1;transform:none}
.xbtn{width:28px;height:28px;border-radius:8px;background:var(--card2);color:var(--muted);font-size:18px;line-height:1}
</style>

ват","Если на турнике первым сдаётся хват, это нормально для первых недель. Висы из тренировки Б это исправят."],["Сон","7–8 часов. При недосыпе аппетит растёт, а мышцы восстанавливаются хуже."],["Еда до и после","Ужин в 16:30 даёт энергию на тренировку в 20:00. Творог после занятия закрывает потребность в белке."],["Здоровье","При проблемах с давлением, сердцем или суставами начните после консультации с врачом."]],"scale":[["3–4 · легко","Можно свободно разговаривать. Ходьба, разминка, заминка."],["5–6 · умеренно","Дыхание учащённое, говорить можно короткими предложениями. Спокойные отрезки интервалов."],["7–8 · тяжело","В силовой: в конце подхода остаётся запас в 2 повтора. В интервалах: говорить удаётся только отдельными словами. Основная рабочая зона."],["9–10 · предел","Работа до отказа. В этой программе не нужна: риск травмы выше, а пользы для похудения нет."]]};</script>

function vSteps(){
  const w = weekOf(S.sel), first = (w-1)*7, g = program().steps[w-1]*1000, t = todayIdx();
  let sum = 0, cnt = 0, hit = 0;
  const rows = Array.from({ length: 7 }, (_, j) => { const i = first + j, s = day(i).steps;
    if (s != null) { sum += s; cnt++; if (s >= g) hit++; }
    return `<div class="steprow ${i === t ? "cur" : ""}"><div><div class="dn">${WD[j]}</div><div class="hint" style="margin-top:0">${fmtDate(i)}</div></div>
      <input class="field sm" inputmode="numeric" autocomplete="off" placeholder="—" data-f="steps" data-i="${i}" value="${s != null ? s : ""}" aria-label="Шаги ${WD[j]}">
      <span class="ok ${s != null && s >= g ? "on" : ""}">${CHECK}</span></div>`; }).join("");
  const avgs = program().steps.map((gg, k) => { let s = 0, n = 0; for (let j = 0; j < 7; j++) { const v = day(k*7+j).steps; if (v != null) { s += v; n++; } } return { avg: n ? s/n : null, goal: gg*1000 }; });
  const maxV = Math.max(13000, ...avgs.map(a => a.avg || 0));
  const bars = avgs.map((a, k) => `<div title="Неделя ${k+1}"><u style="bottom:${a.goal/maxV*100}%"></u>${a.avg != null ? `<i class="${a.avg < a.goal ? "miss" : ""}" style="height:${a.avg/maxV*100}%"></i>` : ""}</div>`).join("");
  return `
  <section class="card">
    <div class="eyebrow">Неделя ${w} · цель ${int(g)} шагов в день</div>
    <div class="grid4" style="margin-top:10px">

      <div class="stat"><small>Дней с целью</small><b>${hit} из 7</b></div>
      <div class="stat"><small>Всего</small><b>${cnt ? int(sum) : "—"}</b></div>
      <div class="stat"><small>Внесено дней</small><b>${cnt}</b></div>
    </div></section>
  <section class="card">${rows}<div style="margin-top:10px"><button class="btn sec" data-health>♥ Шаги за сегодня из «Здоровья»</button></div>
    <details style="margin-top:10px"><summary>Как подключить «Здоровье» на iPhone</summary>${healthHelp()}</details><div class="hint">Шаги смотрите в приложении телефона или часов и вносите вечером.</div></section>

    <div class="hint">Пунктир: цель недели. Зелёный: цель выполнена, оранжевый: ниже цели.</div></section>`;
}

function weightSeries(){ const r = []; for (let i = 0; i < DAYS; i++) { const v = day(i).weight; if (v != null) r.push([i, v]); } return r; }
function vProgress(){
  const pts = weightSeries(), sw = S.profile.startWeight || pts.length && pts[0][1] || 80, h = (S.profile.height || 175) / 100;
  const last = pts.length ? pts[pts.length-1] : null, cur = last ? last[1] : null;
  const lost = cur != null ? sw - cur : null, bmi = (cur != null ? cur : sw) / (h*h);
  // chart
  const W = 360, H = 210, L = 30, R = 8, T = 10, B = 24;
  const vals = pts.map(p => p[1]).concat([sw]);
  let lo = Math.floor(Math.min(...vals) - 1), hi = Math.ceil(Math.max(...vals) + 0.5); if (hi - lo < 4) lo = hi - 4;
  const x = i => L + i / (DAYS-1) * (W - L - R), y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  let grid = ""; const step = (hi - lo) > 8 ? 2 : 1;
  for (let v = lo; v <= hi; v += step) grid += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;
  for (let k = 0; k <= 12; k += 3) grid += `<text x="${x(Math.min(k*7, DAYS-1))}" y="${H-8}" text-anchor="${k === 0 ? "start" : k === 12 ? "end" : "middle"}" font-size="11" fill="var(--muted)">${k === 0 ? "старт" : "нед " + k}</text>`;
  const goalLine = `<line x1="${x(0)}" y1="${y(sw)}" x2="${x(DAYS-1)}" y2="${y(sw - 12*0.75)}" stroke="var(--accent)" stroke-dasharray="4 5" opacity=".55"/>`;
  const startLine = `<line x1="${L}" x2="${W-R}" y1="${y(sw)}" y2="${y(sw)}" stroke="var(--muted)" stroke-dasharray="2 4"/>`;
  const line = pts.length > 1 ? `<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p => x(p[0])+","+y(p[1])).join(" ")}"/>` : "";
  const dots = pts.map(p => `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="3.5" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>`).join("");
  const chart = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График веса"><defs><clipPath id="pc"><rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}"/></clipPath></defs>${grid}${startLine}<g clip-path="url(#pc)">${goalLine}</g>${line}${dots}</svg>`;
  // weeks
  const t = todayIdx(); let prevAvg = sw, rows = "", doneW = 0, planW = 0;
  for (let k = 0; k < 12; k++) {
    let ws = 0, wn = 0, ss = 0, sn = 0, tn = 0, tp = 0;
    for (let j = 0; j < 7; j++) { const i = k*7+j, d = day(i); if (d.weight != null) { ws += d.weight; wn++; } if (d.steps != null) { ss += d.steps; sn++; }
      if (plan(i).type !== "rest") { if (i <= t) { tp++; planW++; } if (trainDone(i).full) { tn++; doneW++; } } }
    if (k*7 > t && !wn && !sn) continue;
    const avg = wn ? ws/wn : null, ch = avg != null ? avg - prevAvg : null; if (avg != null) prevAvg = avg;
    rows += `<tr class="${weekOf(clampI(t)) === k+1 ? "cur" : ""}"><td>${k+1}</td><td>${avg != null ? num(avg, 1) : "—"}</td>
      <td style="color:${ch == null ? "inherit" : ch <= 0 ? "var(--accent)" : "var(--fast)"}">${ch != null ? (ch > 0 ? "+" : ch < 0 ? "−" : "") + num(Math.abs(ch), 1) : "—"}</td>
      <td>${sn ? int(ss/sn) : "—"}</td><td>${tn} из ${tp}</td></tr>`;
  }
  const weeksPassed = last ? Math.max(1, (last[0]+1)/7) : null;
  return `
  <section class="card">
    <div class="grid4">
      <div class="stat"><small>Старт</small><b>${num(sw)} кг</b></div>
      <div class="stat"><small>Сейчас</small><b>${cur != null ? num(cur) + " кг" : "—"}</b>${last ? `<small>${fmtDate(last[0])}</small>` : ""}</div>
      <div class="stat"><small>Сброшено</small><b style="color:${lost != null && lost >= 0 ? "var(--accent)" : "inherit"}">${lost != null ? (lost >= 0 ? "−" : "+") + num(Math.abs(lost), 1) + " кг" : "—"}</b></div>
      <div class="stat"><small>ИМТ</small><b>${num(bmi, 1)}</b><small>норма до 25</small></div>
    </div>
    ${lost != null && weeksPassed ? `<div class="hint">Темп: ${num(lost/weeksPassed, 1)} кг в неделю. Норма 0,5–1 кг; в первую неделю больше за счёт воды.</div>` : ""}
  </section>
  <section class="card"><div class="rowh"><h2 style="font-size:16px">Вес</h2><span class="hint" style="margin:0">пунктир: темп −0,75 кг/нед</span></div>
    ${chart}${pts.length ? "" : '<div class="empty">Внесите вес во вкладке «Сегодня», и здесь появится график.</div>'}</section>
  <div class="sec-title">По неделям</div>
  <section class="card"><table class="tbl"><tr><th>Нед.</th><th>Ср. вес</th><th>Изм.</th><th>Шаги</th><th>Тренировки</th></tr>${rows}</table>
    <div class="hint">Тренировка засчитывается, когда отмечены все её пункты. Выполнено ${doneW} из ${planW} на сегодня.</div></section>
  ${profileCard()}
  ${settingsCard(sw)}`;
}

function readSetup(){
  const g = id => document.getElementById(id), on = id => { const b = document.querySelector("#" + id + " button.on"); return b ? b.dataset.v : null; };
  const lv = document.querySelector("#s-level .lvl.on"), health = {};
  document.querySelectorAll("[data-h]").forEach(x => { if (x.checked) health[x.dataset.h] = true; });
  const sex = on("s-sex") || "m"; if (sex !== "f") { delete health.pregnant; delete health.bf; }
  return { sex, job: on("s-job") || "sit", goal: on("s-goal") || "lose", pace: on("s-pace") || "mid", eq: (() => { const q = {}; document.querySelectorAll("[data-eq]").forEach(x => { if (x.checked) q[x.dataset.eq] = true; }); return q; })(), level: lv ? +lv.dataset.lv : 2,
    age: parseNum(g("s-age").value), height: parseNum(g("s-h").value), startWeight: parseNum(g("s-w").value),
    testPush: parseNum(g("s-pu").value), testPull: parseNum(g("s-pl").value), health, ack: !!(g("s-ack") && g("s-ack").checked), d: parseKey(g("s-d").value) };
}
function suggestLevel(pu, pl){
  if (pu == null || Number.isNaN(pu)) return null;
  let l = pu < 1 ? 1 : pu <= 10 ? 2 : pu <= 25 ? 3 : pu <= 40 ? 4 : 5;
  if (pl != null && !Number.isNaN(pl)) { if (l >= 5 && pl < 12) l = 4; if (l >= 4 && pl < 5) l = 3; }
  return l;
}
function setupLive(){
  const el = document.getElementById("s-prev"), v = document.getElementById("s-d"); if (!el || !v) return;
  const r = readSetup(), dd = parseKey(v.value);
  if (dd) { const m = mondayOf(dd); el.textContent = "Программа идёт неделями с понедельника: неделя 1 начнётся в понедельник, " + m.getDate() + " " + MON[m.getMonth()] + "."; } else el.textContent = "";
  document.getElementById("s-goald").textContent = GOAL_DESC[r.goal] || "";
  document.getElementById("s-pacew").style.display = r.goal === "lose" ? "" : "none";

  const src = { sex: r.sex, age: r.age, height: r.height, startWeight: r.startWeight, health: r.sex === "f" ? r.health : Object.assign({}, r.health, { pregnant: false, bf: false }), goal: r.goal, level: r.level };
  const list = (r.age > 0 && r.height > 0 && r.startWeight > 0) ? warnings(src) : warnings(Object.assign({}, src, { height: 0 }));

function saveSetup(){
  const err = document.getElementById("s-err"), r = readSetup(), bad = [];
  if (!(r.age >= 14 && r.age <= 90)) bad.push("возраст от 14 до 90");
  if (!(r.height >= 120 && r.height <= 230)) bad.push("рост от 120 до 230 см");
  if (!(r.startWeight >= 35 && r.startWeight <= 300)) bad.push("вес от 35 до 300 кг");
  if (!r.d) bad.push("дату старта");

  const np = { sex: r.sex, age: Math.round(r.age), height: Math.round(r.height), startWeight: Math.round(r.startWeight * 10) / 10, start: ymd(mondayOf(r.d)),
    job: r.job, goal: r.goal, pace: r.pace, level: r.level, eq: r.eq, place: undefined, health: r.health, ack: r.ack, v: 2 };
  if (r.testPush != null && !Number.isNaN(r.testPush)) np.testPush = Math.round(r.testPush);
  if (r.testPull != null && !Number.isNaN(r.testPull)) np.testPull = Math.round(r.testPull);
  if (warnings(np).length && !r.ack) { err.textContent = "Отметьте в пункте 5, что проконсультируетесь с врачом."; document.getElementById("s-ackw").scrollIntoView({ block: "center" }); return; }

let healthAsked = 0;
async function healthSteps(){
  let txt = "";
  try { if (navigator.clipboard && navigator.clipboard.readText) txt = await navigator.clipboard.readText(); } catch (e) {}
  const m = /(?:GROM|ШАГИ)\s+([\d\s.,]+?)\s*(\d{4}-\d{2}-\d{2})?\s*$/i.exec((txt || "").trim());
  if (m) {
    const v = Math.round(parseFloat(m[1].replace(/\s/g, "").replace(",", "."))), k = m[2], i = k ? idxOfKey(k) : clampI(todayIdx());
    if (v >= 0 && v < 100000 && i >= 0 && i < DAYS) {
      mutDay(i, d => { d.steps = v; }); S.sel = i; render(); toast("Шаги за " + fmtDate(i) + ": " + int(v));
      try { await navigator.clipboard.writeText(""); } catch (e) {}
      return;
    }
  }
  if (Date.now() - healthAsked < 120000) { toast("Не нашёл шаги в буфере. Проверьте команду «" + SHORTCUT + "»: инструкция во вкладке «Активность»."); }
  healthAsked = Date.now();
  location.href = "shortcuts://run-shortcut?name=" + encodeURIComponent(SHORTCUT);
}

  ["Баскетбол, волейбол", 6.5], ["Теннис, бадминтон", 6], ["Танцы", 5], ["Скакалка", 11], ["Подъём по лестнице", 8], ["Тренажёрный зал", 5],
  ["Йога, растяжка", 2.5], ["Уборка, работа в саду", 3.5], ["Лыжи, коньки", 7]];
function extraFood(i){ return (day(i).extra || []); }
function burned(i){
  const p = prof(), d = day(i), w = d.weight || curWeight(), fem = p.sex === "f";
  const bmr = 10*w + 6.25*(p.height || 175) - 5*(p.age || 30) + (fem ? -161 : 5);
  const base = bmr * ({ sit: 1.2, stand: 1.375, phys: 1.55 }[p.job] || 1.2);
  const steps = (d.steps || 0) * w * 0.0005;
  const pl = plan(i), td = trainDone(i), frac = td.of ? td.n / td.of : 0;
  let train = 0;
  if (pl.type === "strength") train = 4 * w * (parseInt(pl.dur, 10) || 45) / 60 * frac;
  if (pl.type === "interval") train = 3 * w * (pl.iv ? pl.iv.total : 30) / 60 * frac;
  const act = (d.act || []).reduce((s, a) => s + (a.kcal || 0), 0);
  const r = { base: Math.round(base), steps: Math.round(steps), train: Math.round(train), act: Math.round(act) };
  r.total = r.base + r.steps + r.train + r.act; return r;
}

}
function safeRender(){ if (isEditing()) S.needRender = true; else render(); }
document.addEventListener("focusout", () => setTimeout(() => { if (S.needRender && !isEditing()) render(); }, 60));

/* ---------- timers ---------- */
let ac = null;
function beep(n){
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    for (let k = 0; k < (n || 1); k++) { const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + k*0.28;
      o.frequency.value = 880; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.3, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+0.22); o.start(t0); o.stop(t0+0.25); } } catch (e) {}
  try { navigator.vibrate && navigator.vibrate(n > 1 ? [200, 100, 200] : 250); } catch (e) {}
}
const mmss = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ":" + pad(s % 60); };
let REST = null; // {end, total}
function startRest(sec){ try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} REST = { end: Date.now() + sec*1000, total: sec }; drawRest(); }
function drawRest(){
  const el = document.getElementById("timerbar");
  if (!REST) { el.hidden = true; el.innerHTML = ""; return; }
  const left = (REST.end - Date.now()) / 1000;
  el.hidden = false; el.innerHTML = `<div><span>Отдых</span><b>${mmss(left)}</b><button data-reststop>Стоп</button></div>`;
}
let IT = null; // {key, phases, idx, end, paused, left, running}
function buildPhases(iv){
  const ph = [{ n: "Разминка", s: 300, c: "" }];
  for (let r = 1; r <= iv.r; r++) { ph.push({ n: "Быстро · круг " + r + " из " + iv.r, s: iv.f*60, c: "fast" }); ph.push({ n: "Спокойно · круг " + r + " из " + iv.r, s: iv.s*60, c: "calm" }); }
  ph.push({ n: "Заминка", s: 300, c: "" }); return ph;
}
function itState(){
  const p = plan(S.sel); if (!p.iv) return null;
  const key = keyAt(S.sel);
  if (!IT || IT.key !== key) IT = { key, phases: buildPhases(p.iv), idx: 0, left: 300, end: 0, running: false, done: false };
  return IT;
}
function drawITimer(){
  const el = document.getElementById("itimer"); if (!el) return; const t = itState(); if (!t) return;
  const ph = t.phases[t.idx], left = t.running ? (t.end - Date.now())/1000 : t.left;
  let rest = left; for (let k = t.idx+1; k < t.phases.length; k++) rest += t.phases[k].s;
  el.innerHTML = `<div class="timer ${t.done ? "" : ph.c}">
    <div class="ph">${t.done ? "Готово" : esc(ph.n)}</div><div class="big">${t.done ? "0:00" : mmss(left)}</div>
    <div class="hint" style="margin:0">${t.done ? "Отметьте пункты ниже" : "До конца " + mmss(rest)}${!t.done && t.idx+1 < t.phases.length ? " · дальше: " + esc(t.phases[t.idx+1].n) : ""}</div>
    <div class="row">${t.done ? "" : `<button class="btn" data-it="${t.running ? "pause" : "start"}">${t.running ? "Пауза" : (t.idx || t.left !== t.phases[0].s ? "Продолжить" : "Старт таймера")}</button>
      <button class="btn sec" data-it="skip">Следующий этап</button>`}<button class="btn sec" data-it="reset">Сброс</button></div></div>`;
}
let wakeLock = null;
async function keepAwake(on){ try { if (on && navigator.wakeLock && !wakeLock) wakeLock = await navigator.wakeLock.request("screen"); else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; } } catch (e) { wakeLock = null; } }
function itAction(a){
  const t = itState(); if (!t) return;
  if (a === "start") { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume && ac.resume(); } catch (e) {} t.running = true; t.end = Date.now() + t.left*1000; keepAwake(true); }
  else if (a === "pause") { t.left = Math.max(0, (t.end - Date.now())/1000); t.running = false; keepAwake(false); }
  else if (a === "skip") nextPhase(t, false);
  else if (a === "reset") { IT = null; keepAwake(false); }
  drawITimer();
}
function nextPhase(t, sound){
  if (t.idx + 1 >= t.phases.length) { t.done = true; t.running = false; keepAwake(false); if (sound) beep(3); return; }
  t.idx++; t.left = t.phases[t.idx].s; if (t.running) t.end = Date.now() + t.left*1000;
  if (sound) beep(t.phases[t.idx].c === "fast" ? 2 : 1);
}
setInterval(() => {
  if (REST) { if (Date.now() >= REST.end) { REST = null; beep(2); } drawRest(); }
  if (IT && IT.running) { if (Date.now() >= IT.end) nextPhase(IT, true); if (document.getElementById("itimer")) drawITimer(); }
}, 250);

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const ds = b.dataset;
  if (ds.seg) { b.parentNode.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); setupLive(); return; }
  if (ds.lv) { document.querySelectorAll("#s-level .lvl").forEach(x => x.classList.toggle("on", x === b)); return; }
  if (ds.health != null) { healthSteps(); return; }
  if (ds.add === "food") { addFood(); return; }
  if (ds.add === "act") { addAct(); return; }
  if (ds.delfood != null) { const k = +ds.delfood; mutDay(S.sel, d => { d.extra = (d.extra || []).filter((_, j) => j !== k); }); render(); return; }
  if (ds.delact != null) { const k = +ds.delact; mutDay(S.sel, d => { d.act = (d.act || []).filter((_, j) => j !== k); }); render(); return; }
  if (ds.setup === "open") { S.setup = true; render(); window.scrollTo(0, 0); return; }
  if (ds.setup === "cancel") { S.setup = false; render(); return; }
  if (ds.setup === "save") { saveSetup(); return; }
  if (ds.tab) { S.setup = false; S.tab = ds.tab; try { localStorage.setItem("pp_tab", S.tab); } catch (er) {} render(); window.scrollTo(0, 0); return; }
  if (ds.go) { S.tab = ds.go; try { localStorage.setItem("pp_tab", S.tab); } catch (er) {} render(); window.scrollTo(0, 0); return; }
  if (ds.day != null) { S.sel = clampI(+ds.day); render(); return; }
  if (ds.wk) { S.sel = clampI(S.sel + 7 * +ds.wk); render(); return; }
  if (ds.today != null) { S.sel = clampI(todayIdx()); render(); return; }
  if (ds.check) { const k = ds.check; mutDay(S.sel, d => { d.train = d.train || {}; if (d.train[k]) delete d.train[k]; else d.train[k] = true; }); render(); return; }
  if (ds.meal) { const k = ds.meal; mutDay(S.sel, d => { d.meals = d.meals || {}; if (d.meals[k]) delete d.meals[k]; else d.meals[k] = true; }); render(); return; }
  if (ds.alt != null) { const v = ds.alt === "1"; if (!!day(S.sel).altBreakfast === v) return; mutDay(S.sel, d => { if (v) d.altBreakfast = true; else delete d.altBreakfast; }); render(); return; }
  if (ds.rest) { startRest(+ds.rest); return; }
  if (ds.reststop != null) { REST = null; drawRest(); return; }
  if (ds.it) { itAction(ds.it); return; }
  if (extraClick(ds, b)) return;
});
function applyField(el, delay){
  const f = el.dataset.f; if (!f) return false;
  if (f === "fact") { const i = +el.dataset.i, k = el.dataset.k, v = el.value.slice(0, 300);
    if (((day(i).fact || {})[k] || "") === v) return false;
    mutDay(i, d => { d.fact = d.fact || {}; if (v) d.fact[k] = v; else delete d.fact[k]; }, delay); return true; }
  const v = parseNum(el.value);
  const lim = { weight: [30, 300], steps: [0, 100000], startWeight: [30, 300], height: [100, 250] }[f];
  if (Number.isNaN(v) || (v != null && (v < lim[0] || v > lim[1]))) { el.classList.add("bad"); return false; }
  el.classList.remove("bad");
  const val = v == null ? null : (f === "steps" || f === "height") ? Math.round(v) : Math.round(v*10)/10;
  if (f === "startWeight" || f === "height") {
    if (val == null || S.profile[f] === val) return false;
    S.profile = Object.assign({}, S.profile, { [f]: val }); queueSave("profile", delay); return true; }
  const i = +el.dataset.i, cur = day(i)[f]; if ((cur == null ? null : cur) === val) return false;
  mutDay(i, d => { if (val == null) delete d[f]; else d[f] = val; }, delay); return true;
}
document.addEventListener("input", e => { if (e.target.matches("input[data-f]")) applyField(e.target, 900); });
document.addEventListener("change", e => { if (e.target.matches("input[data-f]")) { applyField(e.target, 200); safeRender(); } });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("input[data-f]")) e.target.blur(); });

/* ---------- boot ---------- */
window.__plan = { program, nutrition, mealPlan, plan, foodTotals, warnings, burned };
boot();
})();
</script>
